<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Conversation</title>
<!-- Silero VAD via ONNX Runtime Web -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="/vad_core.js"></script>
<style>
  :root {
    --bg:       #0d0f12;
    --surface:  #161a20;
    --surface2: #1e2430;
    --border:   #2a3040;
    --text:     #e8ecf0;
    --muted:    #7a8898;
    --accent:   #4C8EFF;
    --success:  #1EBC8E;
    --warning:  #F5A623;
    --danger:   #FF3621;
    --radius:   10px;
    --font:     -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: grid;
    grid-template-rows: 52px 1fr 52px;
    overflow: hidden;
  }

  /* ─── Header ─── */
  header {
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .app-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    opacity: 0.85;
  }

  /* Orb */
  .orb-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .orb {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface2); border: 2px solid var(--border);
    transition: all 0.3s ease; position: relative;
  }
  .orb::after {
    content: ''; position: absolute; inset: 3px; border-radius: 50%;
    background: var(--muted); opacity: 0.4; transition: all 0.3s ease;
  }
  .orb.listening  { border-color: var(--accent); }
  .orb.listening::after  { background: var(--accent); opacity: 0.8; animation: pulse-blue 1.2s ease-in-out infinite; }
  .orb.thinking   { border-color: var(--warning); }
  .orb.thinking::after   { background: var(--warning); opacity: 0.7; animation: spin 1s linear infinite; }
  .orb.speaking   { border-color: var(--success); }
  .orb.speaking::after   { background: var(--success); opacity: 0.8; animation: pulse-green 0.8s ease-in-out infinite; }
  .orb-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Session button */
  .session-btn {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 12px; font-weight: 500; font-family: var(--font);
    cursor: pointer; transition: all 0.15s; margin-left: 14px;
  }
  .session-btn.start {
    background: rgba(76,142,255,0.12); border-color: rgba(76,142,255,0.35); color: var(--accent);
  }
  .session-btn.start:hover { background: rgba(76,142,255,0.22); }
  .session-btn.end {
    background: rgba(255,54,33,0.1); border-color: rgba(255,54,33,0.3); color: var(--danger);
  }
  .session-btn.end:hover { background: rgba(255,54,33,0.2); }

  /* ─── Conversation thread ─── */
  .thread {
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .idle-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: var(--muted);
    text-align: center;
  }
  .idle-icon  { font-size: 36px; opacity: 0.2; }
  .idle-label { font-size: 13px; opacity: 0.4; }
  .idle-start-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; font-family: var(--font);
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(76,142,255,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .idle-start-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(76,142,255,0.5); }

  .bubble-row {
    display: flex;
    padding: 4px 20px;
    animation: fadeSlide 0.25s ease;
  }
  .bubble-row.user      { justify-content: flex-end; }
  .bubble-row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 68%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .bubble.user {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.typing::after {
    content: '▊';
    animation: blink 0.7s step-start infinite;
    color: var(--accent); font-size: 11px;
  }

  /* ─── Footer transcript strip ─── */
  footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .transcript-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); flex-shrink: 0; }
  .transcript-text  { font-size: 13px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .transcript-text.live { color: var(--accent); font-style: normal; }

  .voice-meter      { width: 72px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .voice-meter-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.08s linear; }

  /* ─── Animations ─── */
  @keyframes fadeSlide { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse-blue  { 0%,100%{transform:scale(.85);opacity:.6} 50%{transform:scale(1.1);opacity:1} }
  @keyframes pulse-green { 0%,100%{transform:scale(.9);opacity:.7}  50%{transform:scale(1.05);opacity:1} }
  @keyframes spin   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes blink  { 50%{opacity:0} }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- Header -->
<header>
  <span style="font-size:18px;opacity:0.6">🎙</span>
  <span class="app-title" id="app-title">Live Conversation</span>
  <div class="orb-wrap">
    <div class="orb" id="orb"></div>
    <span class="orb-label" id="orb-label">idle</span>
  </div>
  <button class="session-btn start" id="session-btn" onclick="onSessionBtn()">Start</button>
</header>

<!-- Thread -->
<div class="thread" id="thread">
  <div class="idle-state" id="idle-state">
    <div class="idle-icon">🎙</div>
    <button class="idle-start-btn" onclick="onSessionBtn()">▶ Start Session</button>
    <div class="idle-label">Voice-on during active session</div>
  </div>
</div>

<!-- Footer -->
<footer>
  <span class="transcript-label">Heard</span>
  <span class="transcript-text" id="transcript-text">—</span>
  <div class="voice-meter"><div class="voice-meter-fill" id="voice-meter-fill"></div></div>
</footer>

<script>
  // ─── State ───────────────────────────────────────────────────────────────
  let sessionActive = false;
  let orbState      = 'idle';
  let vadPaused     = false;
  let _vad          = null;
  let messages      = [];   // [{role:'user'|'assistant', text, id}]
  let _msgCounter   = 0;

  // ─── SSE ─────────────────────────────────────────────────────────────────
  function connectSSE() {
    const es = new EventSource('/events');
    es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type !== 'ping') handleEvent(msg.type, msg.data || {});
      } catch(ex) { console.warn('SSE parse error', ex); }
    };
    es.onerror = () => { setTimeout(connectSSE, 2000); es.close(); };
  }

  function handleEvent(type, data) {
    switch (type) {
      case 'orb':           orbState = data.state; break;
      case 'session_start': onSessionStart(); break;
      case 'session_end':   onSessionEnd();   break;
      case 'transcript':    onTranscript(data.text, data.live); break;
      case 'agent_speaking':orbState = 'speaking'; break;
      case 'agent_done':    orbState = sessionActive ? 'listening' : 'idle'; break;
      case 'vad_pause':  vadPaused = true;  if (_vad) _vad.pause();  break;
      case 'vad_resume': vadPaused = false; if (_vad) _vad.resume(); break;
      // App-specific events forwarded as-is; custom HTML can override handleAppEvent
      default: handleAppEvent(type, data);
    }
    render();
  }

  // Override in custom HTML to handle application-specific SSE events
  function handleAppEvent(type, data) {}

  // ─── Session ──────────────────────────────────────────────────────────────
  function onSessionStart() {
    sessionActive = true;
    messages = [];
    orbState = 'thinking';
    document.getElementById('idle-state')?.remove();
  }
  function onSessionEnd() {
    sessionActive = false;
    orbState = 'idle';
  }
  function onTranscript(text, live) {
    const el = document.getElementById('transcript-text');
    if (el) {
      el.textContent = text || '—';
      el.className = 'transcript-text' + (live ? ' live' : '');
    }
  }

  function addMessage(role, text) {
    const id = ++_msgCounter;
    messages.push({ role, text, id });
    renderThread();
    return id;
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function render() {
    // Orb
    const orb = document.getElementById('orb');
    const lbl = document.getElementById('orb-label');
    if (orb) { orb.className = 'orb ' + orbState; }
    if (lbl) lbl.textContent = orbState;

    // Session button
    const btn = document.getElementById('session-btn');
    if (btn) {
      btn.textContent = sessionActive ? 'End' : 'Start';
      btn.className   = 'session-btn ' + (sessionActive ? 'end' : 'start');
    }
  }

  function renderThread() {
    const thread = document.getElementById('thread');
    if (!thread) return;
    thread.innerHTML = messages.map(m => `
      <div class="bubble-row ${m.role}">
        <div class="bubble ${m.role}">${esc(m.text)}</div>
      </div>`).join('');
    thread.scrollTop = thread.scrollHeight;
  }

  // ─── Controls ─────────────────────────────────────────────────────────────
  async function onSessionBtn() {
    if (!sessionActive) {
      await fetch('/session/start', { method: 'POST' });
    } else {
      await fetch('/session/end',   { method: 'POST' });
    }
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Voice pipeline ───────────────────────────────────────────────────────
  let voiceWs          = null;
  let voiceAudioCtx    = null;
  let voicePlaybackCtx = null;
  let voiceWorkletNode = null;
  let voiceMediaStream = null;
  let voicePhase       = 'idle'; // idle | listening | processing | speaking
  let voiceTtsPlaying  = false;
  let voiceAudioQueue  = [];
  let voiceIsPlaying   = false;
  let voiceCurrentSrc  = null;
  let voicePendingAudio= [];

  // Intercept session events to start/stop voice WS
  const _baseHandleEvent = handleEvent;
  handleEvent = function(type, data) {
    _baseHandleEvent(type, data);
    if (type === 'session_start') _startVoiceWs();
    else if (type === 'session_end') { _stopVoiceCapture(); if (voiceWs) { voiceWs.close(); voiceWs = null; } }
  };

  async function _startVoiceWs() {
    if (voiceWs && voiceWs.readyState <= 1) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    voiceWs = new WebSocket(`${proto}://${location.host}/voice`);
    voiceWs.onopen  = async () => { await _initVoiceAudio(); };
    voiceWs.onmessage = (e) => { try { _handleVoiceMsg(JSON.parse(e.data)); } catch(_){} };
    voiceWs.onclose   = () => { _stopVoiceCapture(); voicePhase = 'idle'; };
  }

  function _handleVoiceMsg(msg) {
    if (msg.type === 'asr.final') {
      addMessage('user', msg.text || '');
      orbState = 'thinking'; render();
      voicePhase = 'processing';
    } else if (msg.type === 'agent.audio') {
      if (msg.audio) { _queueVoiceAudio(msg.audio); voicePhase = 'speaking'; }
    } else if (msg.type === 'agent.done') {
      _scheduleListeningResume();
    }
  }

  async function _initVoiceAudio() {
    try {
      _ensurePlaybackCtx();
      _vad = new VoiceVAD({
        ort: (typeof ort !== 'undefined') ? ort : null,
        onEndOfSpeech: (reason) => {
          if (!voiceWs || voiceWs.readyState !== 1) return;
          voicePhase = 'processing';
          voiceWs.send(JSON.stringify({ type: 'end_of_speech', reason }));
        },
        onBargeIn: () => {
          if (!voiceWs || voiceWs.readyState !== 1) return;
          _stopVoiceAudio();
          voiceWs.send(JSON.stringify({ type: 'interrupt' }));
        },
        onMeter: (rms) => {
          const fill = document.getElementById('voice-meter-fill');
          if (fill) fill.style.width = `${Math.min(100, Math.round((rms||0)*2200))}%`;
        },
        onPcm: (pcm16) => {
          if (voicePhase === 'listening' && voiceWs && voiceWs.readyState === 1) {
            voiceWs.send(pcm16 instanceof Int16Array ? pcm16.buffer : pcm16);
          }
        },
      });
      _vad.init().catch(() => {});

      voiceMediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
      voiceAudioCtx    = new AudioContext({ sampleRate: 16000 });
      _ensurePlaybackCtx();
      await voiceAudioCtx.audioWorklet.addModule('/pcm-processor.js');
      const src = voiceAudioCtx.createMediaStreamSource(voiceMediaStream);
      voiceWorkletNode = new AudioWorkletNode(voiceAudioCtx, 'pcm-processor');
      voiceWorkletNode.port.onmessage = (e) => {
        if (!voiceWs || voiceWs.readyState !== 1 || voicePhase === 'idle' || voicePhase === 'processing' || !_vad) return;
        const d = e.data;
        const pcm16   = d.pcm16   instanceof ArrayBuffer ? new Int16Array(d.pcm16)    : d.pcm16;
        const float32 = d.float32 instanceof ArrayBuffer ? new Float32Array(d.float32) : d.float32;
        _vad.push({ pcm16, float32, rms: d.rms }, voiceTtsPlaying);
      };
      src.connect(voiceWorkletNode);
      voiceWorkletNode.connect(voiceAudioCtx.destination);
      _flushPendingVoiceAudio();
      voicePhase = 'listening';
    } catch(e) { console.error('[voice] mic init failed:', e); }
  }

  function _scheduleListeningResume() {
    if (!voiceTtsPlaying && voiceAudioQueue.length === 0) {
      voicePhase = 'listening';
    } else {
      setTimeout(function check() {
        if (!voiceTtsPlaying && voiceAudioQueue.length === 0) voicePhase = 'listening';
        else setTimeout(check, 200);
      }, 200);
    }
  }

  function _ensurePlaybackCtx() {
    if (voicePlaybackCtx && voicePlaybackCtx.state !== 'closed') return;
    try { voicePlaybackCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){}
  }
  function _queueVoiceAudio(b64) {
    if (!b64) return;
    if (!_playVoiceChunk(b64)) voicePendingAudio.push(b64);
  }
  function _flushPendingVoiceAudio() {
    if (!voicePendingAudio.length || !voicePlaybackCtx) return;
    const q = voicePendingAudio.slice(); voicePendingAudio = [];
    q.forEach(a => _queueVoiceAudio(a));
  }
  function _playVoiceChunk(b64) {
    if (!voicePlaybackCtx || voicePlaybackCtx.state === 'closed') return false;
    if (voicePlaybackCtx.state === 'suspended') voicePlaybackCtx.resume();
    voiceTtsPlaying = true;
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    voiceAudioQueue.push(bytes.buffer.slice(0));
    if (!voiceIsPlaying) _playVoiceNext();
    return true;
  }
  async function _playVoiceNext() {
    if (!voiceAudioQueue.length) { voiceIsPlaying = false; setTimeout(() => { voiceTtsPlaying = false; }, 500); return; }
    if (!voicePlaybackCtx || voicePlaybackCtx.state === 'closed') { voiceIsPlaying = false; return; }
    voiceIsPlaying = true;
    const buf = voiceAudioQueue.shift();
    try {
      const ab  = await voicePlaybackCtx.decodeAudioData(buf);
      const src = voicePlaybackCtx.createBufferSource();
      voiceCurrentSrc = src; src.buffer = ab;
      src.connect(voicePlaybackCtx.destination);
      src.onended = () => { voiceCurrentSrc = null; _playVoiceNext(); };
      src.start();
    } catch(e) { console.error('[voice] audio decode error:', e); _playVoiceNext(); }
  }
  function _stopVoiceAudio() {
    voiceAudioQueue = []; voicePendingAudio = [];
    voiceTtsPlaying = false; voiceIsPlaying = false;
    if (voiceCurrentSrc) { try { voiceCurrentSrc.onended=null; voiceCurrentSrc.stop(); } catch(_){} voiceCurrentSrc = null; }
  }
  function _stopVoiceCapture() {
    _stopVoiceAudio();
    vadPaused = false;
    if (_vad) { _vad.reset(); _vad = null; }
    const fill = document.getElementById('voice-meter-fill');
    if (fill) fill.style.width = '0%';
    if (voiceWorkletNode) { try { voiceWorkletNode.port.onmessage=null; voiceWorkletNode.disconnect(); } catch(_){} voiceWorkletNode = null; }
    if (voiceMediaStream) { try { voiceMediaStream.getTracks().forEach(t=>t.stop()); } catch(_){} voiceMediaStream = null; }
    if (voiceAudioCtx && voiceAudioCtx.state !== 'closed') { try { voiceAudioCtx.close(); } catch(_){} voiceAudioCtx = null; }
  }

  // ─── Boot ─────────────────────────────────────────────────────────────────
  render();
  connectSSE();
</script>
</body>
</html>
