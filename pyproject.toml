[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "liveconv"
version     = "0.1.0"
description = "Provider-agnostic real-time voice conversation framework"
readme      = "README.md"
requires-python = ">=3.10"
license     = {text = "MIT"}

keywords = ["voice", "speech", "conversation", "ASR", "TTS", "VAD", "realtime"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev    = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage   = "https://github.com/kevin-ippen/live-conversation-oss"
Repository = "https://github.com/kevin-ippen/live-conversation-oss"

[tool.setuptools.packages.find]
where = ["."]
include = ["liveconv*"]

[tool.setuptools.package-data]
liveconv = ["*.js", "*.html"]
